<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>烏腦袋 Pigeon Brain</title>
    <!-- Web App 獨立全螢幕模式與圖示設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="烏腦袋">
    
    <!-- 預設 SVG 鴿子 Logo 圖示 (Base64) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234F46E5'/><text x='50' y='68' font-size='55' text-anchor='middle'>🐦</text></svg>">
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234F46E5'/><text x='50' y='68' font-size='55' text-anchor='middle'>🐦</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK (v9 Compact 版本) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <!-- 密碼未通過時顯示的鎖定畫面 -->
    <div id="lock-screen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-white">
        <div class="text-6xl mb-4 animate-bounce">🔒</div>
        <h1 class="text-2xl font-bold mb-2">烏腦袋 Pigeon Brain</h1>
        <p class="text-slate-400 text-sm mb-6">請輸入存取密碼以存取雲端資料庫</p>
        <div class="w-full max-w-xs space-y-3">
            <input type="password" id="password-input" placeholder="請輸入密碼..." class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-center text-lg text-white focus:outline-none focus:border-indigo-500">
            <button onclick="verifyPassword()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition shadow-lg">解鎖 App</button>
        </div>
        <p id="error-msg" class="text-red-400 text-xs mt-3 hidden">❌ 密碼錯誤，請重新輸入！</p>
    </div>

    <!-- App 主體介面 (預設隱藏，密碼驗證通過後才顯示) -->
    <div id="app-content" class="hidden">
        <!-- 頂部 Header -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-3 shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🐦</span>
                <h1 class="font-bold text-lg text-slate-900">烏腦袋</h1>
            </div>
            
            <!-- 身份切換器 -->
            <div class="flex items-center bg-slate-100 p-1 rounded-lg text-sm border border-slate-200">
                <button id="btn-user-wc" onclick="switchUser('WC_bb')" class="px-2.5 py-1 rounded-md transition font-medium">👧 WC bb</button>
                <button id="btn-user-tt" onclick="switchUser('TT_bb')" class="px-2.5 py-1 rounded-md transition font-medium">👦 TT bb</button>
            </div>
        </header>

        <!-- 主要內容區 -->
        <main class="max-w-md mx-auto p-4 space-y-6">
            
            <!-- 🌐 雙人共用清單區塊 -->
            <section class="bg-white rounded-2xl p-4 shadow-sm border border-indigo-100">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center space-x-2">
                        <span class="text-xl">🌐</span>
                        <h2 class="font-bold text-slate-800">雙人共用事項</h2>
                    </div>
                    <span id="sync-status" class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-medium">⚡ 即時同步中</span>
                </div>

                <!-- 新增項目輸入框 -->
                <div class="flex space-x-2 mb-4">
                    <input type="text" id="shared-input" placeholder="新增共用事項..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    <button onclick="addSharedItem()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700 transition">新增</button>
                </div>

                <!-- 清單列表 -->
                <ul id="shared-list" class="space-y-2">
                    <li class="text-center text-slate-400 text-xs py-4">資料載入中...</li>
                </ul>
            </section>

            <!-- 🔒 個人私密筆記區塊 -->
            <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                <div class="flex items-center space-x-2 mb-3">
                    <span class="text-xl">🔒</span>
                    <h2 class="font-bold text-slate-800"><span id="current-user-label">--</span> 的私密事項</h2>
                </div>

                <!-- 新增私密項目輸入框 -->
                <div class="flex space-x-2 mb-4">
                    <input type="text" id="private-input" placeholder="新增個人私密事項..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    <button onclick="addPrivateItem()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-slate-700 transition">新增</button>
                </div>

                <!-- 清單列表 -->
                <ul id="private-list" class="space-y-2">
                    <li class="text-center text-slate-400 text-xs py-4">資料載入中...</li>
                </ul>
            </section>

            <!-- 重新鎖定按鈕 -->
            <div class="text-center pt-2">
                <button onclick="lockApp()" class="text-xs text-slate-400 hover:text-slate-600 underline">🔒 重新鎖定 App (清除本地認證)</button>
            </div>
        </main>
    </div>

    <!-- 邏輯腳本 -->
    <script>
        // ==========================================
        // 1. 安全密碼設定 (請在下方修改為你們的密碼)
        // ==========================================
        const APP_PASSWORD = "20241225"; 

        // ==========================================
        // 2. Firebase 金鑰設定 (請填入你的 Firebase 設定)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBRTeWd0jgIlItcUzcQhEHS4juHjqo-6CU",
            authDomain: "shared-brain-32e5b.firebaseapp.com",
            databaseURL: "https://shared-brain-32e5b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "shared-brain-32e5b",
            storageBucket: "shared-brain-32e5b.firebasestorage.app",
            messagingSenderId: "13262366279",
            appId: "1:13262366279:web:7df3fc8a5718ee5f163362"
        };

        let db = null;
        let currentUser = localStorage.getItem("pigeon_user") || "WC_bb";

        // ==========================================
        // 3. 密碼驗證邏輯
        // ==========================================
        function checkAuth() {
            const isAuth = localStorage.getItem("pigeon_auth");
            if (isAuth === "true") {
                unlockApp();
            }
        }

        function verifyPassword() {
            const input = document.getElementById("password-input").value;
            if (input === APP_PASSWORD) {
                localStorage.setItem("pigeon_auth", "true");
                unlockApp();
            } else {
                document.getElementById("error-msg").classList.remove("hidden");
            }
        }

        function unlockApp() {
            document.getElementById("lock-screen").classList.add("hidden");
            document.getElementById("app-content").classList.remove("hidden");
            initFirebase();
        }

        function lockApp() {
            localStorage.removeItem("pigeon_auth");
            location.reload();
        }

        // 支持按 Enter 鍵解鎖
        document.getElementById("password-input")?.addEventListener("keypress", function(e) {
            if (e.key === "Enter") verifyPassword();
        });

        // ==========================================
        // 4. Firebase 初始化與資料同步
        // ==========================================
        function initFirebase() {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.database();
            
            updateUserUI();
            listenToSharedData();
            listenToPrivateData();
        }

        // 切換使用者身份
        function switchUser(user) {
            currentUser = user;
            localStorage.setItem("pigeon_user", user);
            updateUserUI();
            listenToPrivateData();
        }

        function updateUserUI() {
            const btnWc = document.getElementById("btn-user-wc");
            const btnTt = document.getElementById("btn-user-tt");
            const label = document.getElementById("current-user-label");

            if (currentUser === "WC_bb") {
                btnWc.className = "px-2.5 py-1 rounded-md transition font-medium bg-white text-indigo-600 shadow-sm";
                btnTt.className = "px-2.5 py-1 rounded-md transition font-medium text-slate-500 hover:text-slate-800";
                label.innerText = "👧 WC bb";
            } else {
                btnTt.className = "px-2.5 py-1 rounded-md transition font-medium bg-white text-indigo-600 shadow-sm";
                btnWc.className = "px-2.5 py-1 rounded-md transition font-medium text-slate-500 hover:text-slate-800";
                label.innerText = "👦 TT bb";
            }
        }

        // --- 🌐 共用事項 Firebase 操作 ---
        function listenToSharedData() {
            db.ref("shared_brain_state").on("value", (snapshot) => {
                const data = snapshot.val() || {};
                renderList("shared-list", data, true);
            });
        }

        function addSharedItem() {
            const input = document.getElementById("shared-input");
            const text = input.value.trim();
            if (!text) return;

            db.ref("shared_brain_state").push({
                text: text,
                done: false,
                author: currentUser,
                timestamp: Date.now()
            });
            input.value = "";
        }

        // --- 🔒 私密事項 Firebase 操作 ---
        function listenToPrivateData() {
            const privateRef = `private_brain_state_${currentUser}`;
            db.ref(privateRef).off(); // 先取消舊監聽
            db.ref(privateRef).on("value", (snapshot) => {
                const data = snapshot.val() || {};
                renderList("private-list", data, false);
            });
        }

        function addPrivateItem() {
            const input = document.getElementById("private-input");
            const text = input.value.trim();
            if (!text) return;

            const privateRef = `private_brain_state_${currentUser}`;
            db.ref(privateRef).push({
                text: text,
                done: false,
                timestamp: Date.now()
            });
            input.value = "";
        }

        // --- 切換完成狀態與刪除 ---
        function toggleDone(key, isShared, currentStatus) {
            const path = isShared ? `shared_brain_state/${key}` : `private_brain_state_${currentUser}/${key}`;
            db.ref(path).update({ done: !currentStatus });
        }

        function deleteItem(key, isShared) {
            const path = isShared ? `shared_brain_state/${key}` : `private_brain_state_${currentUser}/${key}`;
            db.ref(path).remove();
        }

        // --- 渲染畫面 ---
        function renderList(elementId, data, isShared) {
            const container = document.getElementById(elementId);
            container.innerHTML = "";

            const keys = Object.keys(data);
            if (keys.length === 0) {
                container.innerHTML = `<li class="text-center text-slate-400 text-xs py-4">尚無任何事項</li>`;
                return;
            }

            keys.reverse().forEach(key => {
                const item = data[key];
                const li = document.createElement("li");
                li.className = "flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100";
                
                li.innerHTML = `
                    <div class="flex items-center space-x-2.5 flex-1 min-w-0 pr-2">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleDone('${key}', ${isShared}, ${item.done})" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
                        <span class="text-sm text-slate-700 truncate ${item.done ? 'line-through text-slate-400' : ''}">${item.text}</span>
                        ${isShared && item.author ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-600">${item.author === 'WC_bb' ? '👧' : '👦'}</span>` : ''}
                    </div>
                    <button onclick="deleteItem('${key}', ${isShared})" class="text-slate-300 hover:text-red-500 text-xs p-1">✕</button>
                `;
                container.appendChild(li);
            });
        }

        // 頁面載入時先執行密碼檢查
        window.onload = checkAuth;
    </script>
</body>
</html>
